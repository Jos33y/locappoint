  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: #10141D;
      min-height: 100vh;
    }
    #root {
      background: #10141D;
      min-height: 100vh;
    }
    /* Boot loader. Target paint under 200ms. Removes itself on window load (3s hard fallback). */
    #loca-boot {
      position: fixed;
      inset: 0;
      background: #10141D;
      display: grid;
      place-items: center;
      z-index: 9999;
      transition: opacity 240ms ease;
    }
    .loca-boot__stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .loca-boot__mark {
      width: 56px;
      height: 56px;
      animation: loca-boot-rise 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes loca-boot-rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .loca-boot__ring {
      position: absolute;
      inset: -18px;
      width: 92px;
      height: 92px;
      /* reset.css caps svg at 100% of its box; this ring is wider on purpose. */
      max-width: none;
      animation: loca-boot-spin 1600ms linear infinite;
    }
    .loca-boot__stage {
      position: relative;
    }
    .loca-boot__track {
      fill: none;
      stroke: rgba(244, 246, 251, 0.1);
      stroke-width: 2.5;
    }
    .loca-boot__arc {
      fill: none;
      stroke: url(#loca-boot-gradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 70 170;
    }
    @keyframes loca-boot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loca-boot__mark,
      .loca-boot__ring { animation: none; }
    }
  </style>
</head>

<body>
  <div id="loca-boot" aria-hidden="true">
    <div class="loca-boot__stage">
      <svg class="loca-boot__ring" viewBox="0 0 92 92" aria-hidden="true">
        <defs>
          <linearGradient id="loca-boot-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2D7FF0" />
            <stop offset="100%" stop-color="#E89A3E" />
          </linearGradient>
        </defs>
        <circle class="loca-boot__track" cx="46" cy="46" r="38" />
        <circle class="loca-boot__arc" cx="46" cy="46" r="38" />
      </svg>
      <img src="/brand/loca-mark.svg" alt="" class="loca-boot__mark" width="56" height="56" draggable="false" />
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Hide boot loader when React signals ready via window.__locaBootReady().
    // Hard fallback at 3s in case the signal never fires.
    (function () {
      var boot = document.getElementById('loca-boot');
      if (!boot) return;
      var done = false;
      function remove() {
        if (done) return;
        done = true;
        boot.style.opacity = '0';
        setTimeout(function () { boot.remove(); }, 240);
      }
      window.__locaBootReady = remove;
      // Fallback: if React never signals ready (real bug OR very slow chunk load),
      // dismiss after 30s. Vite dev cold loads can exceed 15s on Windows.
      setTimeout(function () {
        if (done) return;
        console.warn('[loca-boot] Signal not received after 30s. Force-dismissing loader.');
        remove();
      }, 30000);
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

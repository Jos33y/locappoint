# Supabase CLI settings. Used only for deploying Edge Functions:
#   npm run deploy:notify
# after a one-time: npx supabase login, then npx supabase link --project-ref YOUR-PROJECT-REF

project_id = "locappoint"

[functions.notify]
verify_jwt = false

[functions.payouts]
verify_jwt = true

[functions.checkout]
verify_jwt = true

# Stripe and Paystack cannot send a JWT; the function checks their signatures instead.
[functions.payments-webhook]
verify_jwt = false
